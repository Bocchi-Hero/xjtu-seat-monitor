# Copy to config.yaml and edit. NEVER commit config.yaml.

# Campus SSO (used for login / re-login)
account: "YOUR_STUDENT_ID"
password: "YOUR_PASSWORD"
student_code: ""   # filled automatically after login when possible

# Classes to watch
courses:
  - name: "Course display name"
    teaching_class_id: "20262027XXXXXXXX01"

# Polling (seconds)
poll_interval_sec: 20
poll_jitter_sec: 5
alert_cooldown_sec: 600
session_check_every: 50
# Session fail email cooldown — only send one "session dead" email per interval
session_fail_cooldown_sec: 3600
# 空位持续提醒：0=关闭；>0 时空位保持 N 分钟后周期补发一封（如 30）
respot_remind_min: 0

# 可选：Webhook 推送（QQ 机器人 / Server酱 / Bark / 飞书等，POST JSON 到该地址）。
# 留空 url 则只发邮件。空位出现、掉线、测试时都会同步推送。
webhook:
  enabled: true
  url: ""

# Email: provider = qq | gmail | qq_starttls | custom
mail:
  enabled: true
  provider: qq
  from_addr: "you@qq.com"
  to_addr: "you@qq.com"
  password: "SMTP_AUTH_CODE"   # QQ auth code / Gmail app password — not login password
  # custom:
  # host: "smtp.example.com"
  # port: 465
  # use_ssl: true

session_file: "session.json"
log_file: "monitor.log"
